name: Release

on:
  push:
    tags:
      - 'v*'

permissions: {}

# Two releases at once could publish half of each.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Check the tag
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        # The whole history: the tag is looked for on the main branch.
        with:
          fetch-depth: 0
          persist-credentials: false

      # The checkout may write the tag as the commit it names, annotated or
      # not, so the tag's own object is fetched before its kind is read.
      - name: Check the tag is an annotated version tag
        run: |
          if ! printf '%s\n' "$GITHUB_REF_NAME" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-rc\.[0-9]+)?$'; then
            echo "::error::The tag $GITHUB_REF_NAME is neither vX.Y.Z nor vX.Y.Z-rc.N"
            exit 1
          fi
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          kind="$(git cat-file -t "refs/tags/$GITHUB_REF_NAME")"
          if [ "$kind" != tag ]; then
            echo "::error::The tag $GITHUB_REF_NAME is lightweight, a release tag is annotated"
            exit 1
          fi

      - name: Check the tag is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Check the tag is every package's version
        run: |
          for manifest in packages/*/package.json; do
            version="$(jq -r .version "$manifest")"
            if [ "v$version" != "$GITHUB_REF_NAME" ]; then
              echo "::error file=$manifest::The version is $version, the tag is $GITHUB_REF_NAME"
              exit 1
            fi
          done

  check:
    name: Check
    needs: tag
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: check
    runs-on: ubuntu-latest

    # A reviewer approves here, after the checks and before anything is public.
    environment: npm-publish

    # The registry trusts this job by its identity token: no stored token. The
    # job runs no code of the repository, only the npm CLI on checked tarballs.
    permissions:
      id-token: write

    steps:
      - name: Fetch the tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: tarballs

      # Trusted publishing is the npm CLI's, from 11.5.1 on.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # A package comes after the ones it depends on, and one already on the
      # registry is skipped, so a release that failed halfway is run again.
      - name: Publish
        run: |
          version="${GITHUB_REF_NAME#v}"
          case "$version" in
            *-rc.*) tag=next ;;
            *) tag=latest ;;
          esac
          order='core store decision auth settings test serve adapters'
          set -- tarballs/*.tgz
          if [ "$#" -ne "$(echo "$order" | wc -w)" ]; then
            echo "::error::The tarballs are not the packages in the publishing order"
            ls tarballs
            exit 1
          fi
          sha256sum tarballs/*.tgz
          for name in $order; do
            if seen="$(npm view "@mottyjs/$name@$version" version 2>view.log)"; then
              if [ -n "$seen" ]; then
                echo "@mottyjs/$name@$version is already published"
                continue
              fi
            elif ! grep -q E404 view.log; then
              cat view.log
              echo "::error::The registry did not say whether @mottyjs/$name@$version is published"
              exit 1
            fi
            npm publish "tarballs/mottyjs-$name-$version.tgz" --access public --tag "$tag"
          done

  release:
    name: Attach the tarballs to the release
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Fetch the tarballs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tarballs
          path: tarballs

      # The release is written by whoever pushed the tag. It is made here only
      # if it is still missing.
      - name: Attach
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" tarballs/*.tgz --clobber
            exit 0
          fi
          case "$GITHUB_REF_NAME" in
            *-rc.*) gh release create "$GITHUB_REF_NAME" tarballs/*.tgz --verify-tag --generate-notes --prerelease ;;
            *) gh release create "$GITHUB_REF_NAME" tarballs/*.tgz --verify-tag --generate-notes ;;
          esac
